name: Module task
description: Record module decisions, ownership, implementation scope, and acceptance evidence.
title: "[Module] "
labels: ["module-task"]
body:
  - type: dropdown
    id: direction
    attributes:
      label: Task direction
      options:
        - System Integration
        - Freshman / Onboarding Tool
        - Student Services / Campus Life Tool
        - Food / Location
        - Academic / Latest Updates
        - Trust & Evaluation
        - Roadmap / Plan Lite (optional after core MVP)
        - 3D Map (optional after core MVP)
    validations:
      required: true
  - type: input
    id: interested_members
    attributes:
      label: Interested members
      placeholder: GitHub handles or names
    validations:
      required: true
  - type: input
    id: primary_owner
    attributes:
      label: Primary owner
    validations:
      required: true
  - type: input
    id: collaborators
    attributes:
      label: Collaborators
      placeholder: None yet, or GitHub handles
    validations:
      required: true
  - type: dropdown
    id: priority_class
    attributes:
      label: Core or optional
      options:
        - Core MVP
        - Optional after core MVP
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Expected difficulty
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Decision Gate

        Complete every required field below before implementation. This Issue becomes the specification for the module owner, Coding Agent, reviewer, and System Integration owner. Do not leave product behavior implicit. Follow `docs/collaboration/module-decision-template.md`.
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define the smallest complete outcome.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: representative_questions
    attributes:
      label: Representative and unsupported questions
      description: List at least two questions this delivery must handle and important questions that must fail safely or remain unsupported.
      placeholder: |
        Supported:
        1.
        2.

        Unsupported or safe failure:
        1.
    validations:
      required: true
  - type: textarea
    id: interface_decisions
    attributes:
      label: Interface decisions
      description: Define the Tool or component responsibility, input constraints, output contracts, and expected UI or Agent behavior.
      placeholder: |
        Responsibility:
        Input schema and constraints:
        Output fields and shared contracts:
        UI or Agent behavior:
        Compatibility assumptions:
    validations:
      required: true
  - type: textarea
    id: owned_directories
    attributes:
      label: Owned directories
      placeholder: One path per line
    validations:
      required: true
  - type: textarea
    id: shared_files
    attributes:
      label: Shared files touched
      description: Explain why each high-conflict file is necessary, or write None.
    validations:
      required: true
  - type: textarea
    id: data_sources
    attributes:
      label: Evidence and data decisions
      description: List official sources or domains, provenance and freshness rules, conflict behavior, coordinate evidence where applicable, and curated files. Write N/A only for tasks without factual data.
      placeholder: |
        Allowed official sources/domains:
        Provenance fields:
        Freshness rule:
        Source-conflict behavior:
        Location evidence:
        Curated files/update method:
    validations:
      required: true
  - type: textarea
    id: failure_trust_decisions
    attributes:
      label: Failure and trust decisions
      description: Define deterministic behavior for missing input or evidence, stale/conflicting information, invalid locations, and provider or Tool failure.
      placeholder: |
        Missing input:
        Missing/unreachable evidence:
        Stale or conflicting information:
        Invalid location/coordinate:
        Provider/Tool/integration failure:
        verified / needs_review / unavailable conditions:
        User-visible warning or error:
    validations:
      required: true
  - type: textarea
    id: integration_decisions
    attributes:
      label: Integration decisions
      description: State registry, routing, UI, downstream consumer, dependency, and merge-order needs. Do not ask Integration to infer these from code.
      placeholder: |
        Registry/routing/UI work:
        Upstream dependencies and owners:
        Downstream consumers:
        Integration owner:
        Proposed merge order:
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Map every criterion to its planned implementation and test or review evidence.
      placeholder: |
        | Acceptance criterion | Planned implementation | Test/review evidence |
        | --- | --- | --- |
        |  |  |  |
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Include unit, trust-boundary, and at least two eval questions for Tool work.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies/blockers
      placeholder: None, or list dependencies and owners.
    validations:
      required: true
  - type: textarea
    id: unresolved_decisions
    attributes:
      label: Unresolved decisions
      description: For each item, give the question, decision owner, deadline/blocking condition, options, and whether implementation can safely proceed. Write None only when no material decision remains.
      placeholder: |
        Question:
        Decision owner:
        Deadline or blocker:
        Options considered:
        Safe to proceed without it: Yes/No, because...
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Integration handoff

        Before opening the PR, update this Issue with final changed files, decision changes, checks and test results, delivered eval questions, limitations, and remaining registry, Agent, UI, data, or deployment actions.
