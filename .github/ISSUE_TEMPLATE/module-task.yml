name: Module task
description: Plan a scoped core-module or optional exploration task.
title: "[Module] "
labels: ["module-task"]
body:
  - type: dropdown
    id: direction
    attributes:
      label: Task direction
      options:
        - System Integration
        - Freshman / Onboarding Tool
        - Student Services / Campus Life Tool
        - Food / Location
        - Academic / Latest Updates
        - Trust & Evaluation
        - Roadmap / Plan Lite (optional after core MVP)
        - 3D Map (optional after core MVP)
    validations:
      required: true
  - type: input
    id: interested_members
    attributes:
      label: Interested members
      placeholder: GitHub handles or names
    validations:
      required: true
  - type: input
    id: primary_owner
    attributes:
      label: Primary owner
    validations:
      required: true
  - type: input
    id: collaborators
    attributes:
      label: Collaborators
      placeholder: None yet, or GitHub handles
    validations:
      required: true
  - type: dropdown
    id: priority_class
    attributes:
      label: Core or optional
      options:
        - Core MVP
        - Optional after core MVP
    validations:
      required: true
  - type: dropdown
    id: difficulty
    attributes:
      label: Expected difficulty
      options:
        - Small
        - Medium
        - Large
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define the smallest complete outcome.
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: owned_directories
    attributes:
      label: Owned directories
      placeholder: One path per line
    validations:
      required: true
  - type: textarea
    id: shared_files
    attributes:
      label: Shared files touched
      description: Explain why each high-conflict file is necessary, or write None.
    validations:
      required: true
  - type: textarea
    id: data_sources
    attributes:
      label: Data sources
      description: List traceable official sources, or write N/A.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: Use a checklist.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Tests
      description: Include unit, trust-boundary, and at least two eval questions for Tool work.
    validations:
      required: true
  - type: textarea
    id: blockers
    attributes:
      label: Dependencies/blockers
      placeholder: None, or list dependencies and owners.
    validations:
      required: true
